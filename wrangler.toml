name = "video-claw"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[[d1_databases]]
binding = "DB"
database_name = "video_claw"
database_id = "4234f473-e9de-4895-b534-67a550e0500c"
migrations_dir = "./src/config/db/migrations_sqlite"

# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = ""
# localConnectionString = ""

[observability]
enabled = true

[vars]
# app
NEXT_PUBLIC_APP_URL = "http://localhost:3008"
NEXT_PUBLIC_APP_NAME = "Video Claw"

# theme
NEXT_PUBLIC_THEME = "default"

# appearance
NEXT_PUBLIC_APPEARANCE = "system"

# database
DATABASE_PROVIDER = "d1"
# DATABASE_URL = "./src/config/db/schema.sqlite.ts"
DB_SINGLETON_ENABLED = "true"
DB_MAX_CONNECTIONS = "1"

# auth secret
# openssl rand -base64 32
AUTH_SECRET = "37jmouHvcmtNOWISmBTyk85TW9jjn1Q/deUesTrHra8="
